name: Release Creation

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: dist
    steps:
      - uses: actions/checkout@v4

      # Build step modules with an untracked build output: add a build step here, with working-directory: ".".

      - name: Extract tag version number
        id: get_version
        uses: battila7/get-version-action@v2

      - name: Substitute manifest and download links for versioned ones
        uses: microsoft/variable-substitution@v1
        with:
          files: "dist/module.json"
        env:
          version: ${{ steps.get_version.outputs.version-without-v }}
          url: https://github.com/${{ github.repository }}
          manifest: https://github.com/${{ github.repository }}/releases/latest/download/module.json
          download: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.zip

      - name: Validate manifest substitutions
        env:
          VERSION: ${{ steps.get_version.outputs.version-without-v }}
        run: |
          jq -e --arg v "$VERSION" '(.version == $v) and (.download | startswith("https://"))' module.json

      - run: zip -r ./module.zip *

      - name: Update release with files
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.event.release.name }}
          draft: ${{ github.event.release.unpublished }}
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "dist/module.json, dist/module.zip"
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}

      - name: Publish to Foundry registry
        if: ${{ !github.event.release.prerelease }}
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version-without-v }}
          MANIFEST: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.json
          NOTES: ${{ github.event.release.html_url }}
        run: |
          jq '{id, release: {version: env.VERSION, manifest: env.MANIFEST, notes: env.NOTES, compatibility}}' module.json |
          curl --fail-with-body -sS -X POST https://foundryvtt.com/_api/packages/release_version/ \
            -H "Content-Type: application/json" -H "Authorization: $FOUNDRY_RELEASE_TOKEN" -d @-
